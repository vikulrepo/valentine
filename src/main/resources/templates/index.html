<!DOCTYPE html>
<html>
<head>
    <title>Dear Hemu 💖</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #1a001f, #3b001f, #0f0014);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            color: #f8e7ff;
            text-align: center;
        }

        .container {
            position: relative;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            background: rgba(40, 0, 30, 0.75);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.3),
                0 0 60px rgba(120, 0, 80, 0.4);
            backdrop-filter: blur(6px);
            transition: opacity 1.2s ease;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            letter-spacing: 1px;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            animation: fadeIn 2s forwards;
        }

        p {
            font-size: 18px;
            margin-top: 20px;
            line-height: 1.6;
            animation: fadeIn 3s forwards;
        }

        .buttons {
            margin-top: 40px;
            animation: fadeIn 4s forwards;
        }

        button {
            padding: 12px 30px;
            margin: 12px;
            border-radius: 30px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes-btn {
            background: linear-gradient(45deg, #b8860b, #ffd700);
            color: #3b001f;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
        }

        .no-btn {
            background-color: transparent;
            color: #ffd700;
            border: 1px solid #ffd700;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .heart {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 0, 120, 0.5);
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(-120vh) scale(1.6); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body.cinematic {
            background: radial-gradient(circle at center, #4a0028 0%, #1a001f 60%, #000000 100%);
            transition: background 2s ease;
        }

        .full-screen-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ffd700;
        }

        .proclamation {
            font-size: 34px;
            letter-spacing: 2px;
            animation: fadeIn 2s forwards;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
        }

        .sub-text {
            margin-top: 25px;
            font-size: 20px;
            animation: fadeIn 3s forwards;
            color: #f8e7ff;
        }

        .signature-final {
            margin-top: 40px;
            font-size: 18px;
            animation: fadeIn 4s forwards;
            color: #ffb3d9;
        }
    </style>
</head>

<body>

<div class="hearts"></div>

<div class="container" id="card">
    <h1>Hemu…</h1>

    <p>
        February 14th is approaching…<br>
        It feels incomplete without you beside me.<br><br>
        May I have the honor of calling you my Valentine?
    </p>

    <div class="buttons">
        <button class="yes-btn" id="yesBtn">Yes 💖</button>
        <button class="no-btn" id="noBtn">No 😏</button>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="/music/tu-meri-rani.mp3" type="audio/mpeg">
</audio>

<script>
    // Floating hearts
    const heartsContainer = document.querySelector('.hearts');
    setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = "❤";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (15 + Math.random() * 20) + "px";
        heart.style.animationDuration = (8 + Math.random() * 4) + "s";
        heartsContainer.appendChild(heart);
        setTimeout(() => heart.remove(), 10000);
    }, 400);

    // Music with double tap toggle
    const music = document.getElementById("bgMusic");
    let musicStarted = false;
    let lastTap = 0;

    document.addEventListener("click", function (event) {

        if (event.target.closest("#yesBtn")) return;

        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;

        if (!musicStarted) {
            music.volume = 0.4;
            music.play().catch(()=>{});
            musicStarted = true;
        } else if (tapLength < 300 && tapLength > 0) {
            if (music.paused) music.play();
            else music.pause();
        }

        lastTap = currentTime;
    });

    // Moving NO button
    const noBtn = document.getElementById("noBtn");
    const card = document.getElementById("card");

    function moveButton() {
        const rect = card.getBoundingClientRect();
        const maxX = rect.width - noBtn.offsetWidth - 20;
        const maxY = rect.height - noBtn.offsetHeight - 20;
        noBtn.style.position = "absolute";
        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top = Math.random() * maxY + "px";
    }

    noBtn.addEventListener("mouseenter", moveButton);
    noBtn.addEventListener("touchstart", moveButton);

    // YES cinematic transition
    document.getElementById("yesBtn").addEventListener("click", function() {
        card.style.opacity = "0";

        setTimeout(() => {
            card.remove();
            document.body.classList.add("cinematic");

            const msg = document.createElement("div");
            msg.className = "full-screen-message";
            msg.innerHTML = `
                <div class="proclamation">Then it’s settled.</div>
                <div class="sub-text">February 14th, 2026 belongs to us.</div>
                <div class="signature-final">— Vikul</div>
            `;
            document.body.appendChild(msg);
        }, 1200);
    });
</script>

</body>
</html>
